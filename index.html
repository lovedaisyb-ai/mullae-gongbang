<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta name="description" content="서나네 물레 공방 - 걸어 다니며 물레를 차고 그릇을 빚어 보세요"><style>*,*::before,*::after{box-sizing:border-box}:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>서나네 물레 공방</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Batang:wght@700&family=Gowun+Dodum&display=swap">
<style>
/* Layout: full-bleed 3D studio, translucent slate HUD pinned to the corners, celadon as the single accent */
:root{
  --ink:#f1eee7;
  --muted:#bdb8ad;
  --panel:rgba(30,33,32,.80);
  --panel-solid:#1e2120;
  --line:rgba(241,238,231,.14);
  --celadon:#93bcac;
  --celadon-deep:#4f7f70;
  --warn:#e7bd82;
  --danger:#8a3b2f;
  --danger-line:#c9786a;
  --display:'Gowun Batang', 'Nanum Myeongjo', serif;
  --body:'Gowun Dodum', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--panel-solid);color:var(--ink);font-family:var(--body);}
/* phones: never let the page itself zoom or slide sideways (double-tap, pinch, or the iPhone's auto-zoom on small inputs) */
html,body{touch-action:manipulation;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%;}
body{position:fixed;inset:0;width:100%;}
input,textarea,select{font-size:16px!important;}
html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;}
input{-webkit-user-select:text;user-select:text;}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;}
.hud{position:fixed;z-index:5;pointer-events:none;}
.hud>*{pointer-events:auto;}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}

#brand{top:calc(14px + env(safe-area-inset-top,0px));left:calc(14px + env(safe-area-inset-left,0px));padding:10px 14px;}
#brand h1{margin:0;font-family:var(--display);font-size:20px;letter-spacing:.02em;}
#brand p{margin:2px 0 0;font-size:12px;color:var(--muted);}

#help{top:calc(14px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));padding:10px 14px;font-size:12px;color:var(--muted);line-height:1.7;max-width:230px;}
#help b{color:var(--ink);font-weight:400;}
kbd{font-family:var(--body);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--ink);}

button{font-family:var(--body);color:var(--ink);cursor:pointer;}
button:focus-visible{outline:2px solid var(--celadon);outline-offset:2px;}

#prompt{bottom:calc(28px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);}
#prompt button{display:flex;align-items:center;gap:10px;padding:12px 20px;font-size:16px;background:var(--celadon-deep);border:1px solid var(--celadon);border-radius:999px;box-shadow:0 6px 24px rgba(0,0,0,.35);}

#joy{left:calc(22px + env(safe-area-inset-left,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));width:116px;height:116px;border-radius:50%;background:rgba(30,33,32,.55);border:1px solid var(--line);touch-action:none;}
#knob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:rgba(147,188,172,.55);border:1px solid var(--celadon);pointer-events:none;}

/* throwing HUD */
#tip{top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);padding:9px 16px;font-size:14px;text-align:center;max-width:min(560px,calc(100vw - 32px));box-sizing:border-box;}
#tip.warn{border-color:var(--warn);color:var(--warn);}

#stats{right:calc(14px + env(safe-area-inset-right,0px));top:calc(70px + env(safe-area-inset-top,0px));padding:14px;width:178px;box-sizing:border-box;display:grid;gap:12px;}
#stats .sliders{display:grid;gap:10px;}
#stats .sl{display:grid;gap:4px;min-width:0;}
#rpmWrap{border-radius:10px;padding:4px 6px;margin:-4px -6px;}
#rpmWrap.blink{animation:rpmBlink 1s ease-in-out infinite;}
.nudge{animation:nudge 1s ease-in-out infinite;}
@keyframes nudge{0%,100%{box-shadow:0 0 0 0 rgba(147,188,172,0);}50%{box-shadow:0 0 0 3px var(--celadon),0 0 14px 2px rgba(147,188,172,.75);}}
@keyframes rpmBlink{0%,100%{box-shadow:0 0 0 0 rgba(147,188,172,0);background:transparent;}50%{box-shadow:0 0 0 2px var(--celadon);background:rgba(147,188,172,.2);}}
#stats label{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:6px;}
#stats label output{color:var(--ink);font-variant-numeric:tabular-nums;}
#stats .readouts{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;}
#stats .ro{display:grid;gap:2px;min-width:0;}
#stats .ro span{font-size:12px;color:var(--muted);}
#stats .ro strong{font-weight:400;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap;}
#stats .ro .meter{margin-top:3px;}
#stats .btnrow{flex-wrap:wrap;}
#stats .btnrow .primary{flex-basis:100%;}
input[type=range]{width:100%;accent-color:var(--celadon);}
.meter{height:5px;border-radius:3px;background:rgba(241,238,231,.12);overflow:hidden;}
.meter i{display:block;height:100%;width:0;background:var(--celadon);transition:width .15s;}
.btnrow{display:flex;gap:8px;}
.ghost{flex:1;padding:8px 6px;font-size:13px;background:transparent;border:1px solid var(--line);border-radius:8px;}
.ghost:hover{border-color:var(--celadon);}
.primary{flex:1;padding:9px 6px;font-size:13px;background:var(--celadon-deep);border:1px solid var(--celadon);border-radius:8px;}

#tools{bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:6px;}
#tools button{display:grid;gap:2px;min-width:78px;padding:8px 10px;background:transparent;border:1px solid transparent;border-radius:9px;font-size:14px;}
#tools button small{font-size:11px;color:var(--muted);}
#tools button[aria-pressed=true]{background:var(--celadon-deep);border-color:var(--celadon);}
#tools button[aria-pressed=true] small{color:var(--ink);}

#toast{bottom:calc(110px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);padding:10px 18px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;}
#toast.show{opacity:1;}

#loading{position:fixed;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:18px;color:var(--muted);}

#who{margin:4px 0 0;font-size:12px;color:var(--celadon);}
#myWorkBtn{padding:6px 12px;font-size:12px;background:var(--celadon-deep);border:1px solid var(--celadon);border-radius:999px;}
#brand .brandBtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
#musicBtn{padding:6px 12px;font-size:12px;background:transparent;border:1px solid var(--line);border-radius:999px;}
#musicBtn[aria-pressed=true]{border-color:var(--celadon);color:var(--celadon);}
#workPanel{left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));padding:12px;display:grid;gap:10px;width:min(360px,calc(100vw - 32px));box-sizing:border-box;}
#wpMain{display:flex;align-items:center;gap:8px;}
#wpInfo{flex:1;min-width:0;text-align:center;font-size:14px;font-variant-numeric:tabular-nums;}
#workPanel .sq{flex:0 0 40px;font-size:18px;padding:5px 0;}
#workPanel .danger{flex:1;padding:9px 6px;font-size:13px;background:var(--danger);border:1px solid var(--danger-line);border-radius:8px;}
#wpConfirm span{flex:1.3;font-size:12px;color:var(--warn);align-self:center;}
#viewer{position:fixed;inset:0;z-index:20;background:var(--panel-solid);}
#vc{width:100%;height:100%;display:block;touch-action:none;}
#vClose{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));width:44px;height:44px;border-radius:50%;background:var(--panel);border:1px solid var(--line);font-size:20px;line-height:1;}
#vBar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));padding:10px 18px;text-align:center;display:grid;gap:3px;width:max-content;max-width:calc(100vw - 32px);box-sizing:border-box;}
#vInfo{font-size:15px;font-variant-numeric:tabular-nums;}
#vHint{font-size:12px;color:var(--muted);}
#goWork{left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top,0px));}
#goWork button{padding:11px 18px;font-size:15px;background:var(--celadon-deep);border:1px solid var(--celadon);border-radius:999px;box-shadow:0 6px 24px rgba(0,0,0,.35);white-space:nowrap;}
#chat{right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;padding:6px;}
#chat input{width:200px;padding:8px 10px;font:14px var(--body);color:var(--ink);background:rgba(241,238,231,.08);border:1px solid var(--line);border-radius:8px;}
#chat input:focus{outline:2px solid var(--celadon);outline-offset:1px;}
#chat button{padding:8px 12px;font-size:13px;background:var(--celadon-deep);border:1px solid var(--celadon);border-radius:8px;}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
@media (max-width:640px){
  #prompt{bottom:calc(160px + env(safe-area-inset-bottom,0px));}
  #workPanel{bottom:calc(156px + env(safe-area-inset-bottom,0px));}
  #brand{top:calc(8px + env(safe-area-inset-top,0px));left:calc(8px + env(safe-area-inset-left,0px));padding:6px 10px;border-radius:10px;}
  #brand h1{font-size:15px;}
  #brand p{font-size:11px;margin-top:1px;}
  #brand #sub{display:none;}
  #who{margin-top:1px;}
  #myWorkBtn,#musicBtn{padding:4px 10px;font-size:11px;}
  #brand .brandBtns{margin-top:5px;gap:4px;}
  #chat input{width:120px;}
  #help{display:none;}
  body.throwing #brand{display:none;}
  #tip{top:calc(10px + env(safe-area-inset-top,0px));font-size:13px;padding:8px 12px;width:calc(100vw - 20px);}
  #stats{left:calc(8px + env(safe-area-inset-left,0px));right:calc(8px + env(safe-area-inset-right,0px));top:auto;bottom:calc(66px + env(safe-area-inset-bottom,0px));width:auto;padding:10px 12px;gap:9px;}
  #stats .sliders{grid-template-columns:1fr 1fr;gap:14px;}
  #stats label{font-size:12px;}
  #stats .readouts{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;}
  #stats .ro span{font-size:11px;}
  #stats .ro strong{font-size:14px;}
  #stats .btnrow{flex-wrap:nowrap;gap:6px;}
  #stats .btnrow .primary{flex:1.5 1 0;}
  #stats .btnrow button{padding:9px 4px;font-size:12.5px;white-space:nowrap;}
  #tools{left:calc(8px + env(safe-area-inset-left,0px));right:calc(8px + env(safe-area-inset-right,0px));transform:none;bottom:calc(8px + env(safe-area-inset-bottom,0px));gap:3px;padding:4px;}
  #tools button{flex:1 1 0;min-width:0;padding:11px 2px;font-size:12.5px;white-space:nowrap;justify-items:center;}
  #tools button small{display:none;}
}
@media (prefers-reduced-motion:reduce){ #toast,.meter i{transition:none;} #rpmWrap.blink{animation:none;box-shadow:0 0 0 2px var(--celadon);} .nudge{animation:none;box-shadow:0 0 0 3px var(--celadon);} }
</style>
<style>
/* light theme: pale lime panels, dark olive text, orange accent */
:root{--ink:#38492a;--muted:#6c7f58;--panel:rgba(232,246,214,.94);--panel-solid:#e8f6d6;--line:rgba(56,73,42,.16);--celadon:#ffbe85;--celadon-deep:#f48b34;--warn:#c0452b;color-scheme:light;}
.panel{box-shadow:0 4px 18px rgba(60,50,30,.12);}
.primary,#tools button[aria-pressed=true],#prompt button,#myWorkBtn,#goWork button,#chat button{color:#fff;}
#tools button[aria-pressed=true] small{color:rgba(255,255,255,.9);}
.meter{background:rgba(56,73,42,.16);}
#who{color:#e07a22;}
#joy{background:rgba(232,246,214,.6);}
#knob{background:rgba(244,139,52,.55);border-color:#f48b34;}
#chat input{background:rgba(255,255,255,.6);}
#workPanel .danger{color:#fff;}
@keyframes nudge{0%,100%{box-shadow:0 0 0 0 rgba(0,0,0,0);}50%{box-shadow:0 0 0 3px #f48b34,0 0 14px 2px rgba(244,139,52,.6);}}
@keyframes rpmBlink{0%,100%{box-shadow:0 0 0 0 rgba(0,0,0,0);background:transparent;}50%{box-shadow:0 0 0 2px #f48b34;background:rgba(244,139,52,.15);}}
@media (prefers-reduced-motion:reduce){ .nudge{box-shadow:0 0 0 3px #f48b34;} #rpmWrap.blink{box-shadow:0 0 0 2px #f48b34;} }
</style>

<div id="loading">공방 문을 여는 중…</div>
<canvas id="c" tabindex="0" aria-label="도자기 공방 3D 공간"></canvas>

<div class="hud panel" id="brand"><h1>서나네 물레 공방</h1><p id="sub">물레실 · 산책 중</p><p id="who">공방 연결 중…</p><div class="brandBtns"><button id="myWorkBtn" type="button" hidden>내 작품 보기</button></div></div>

<div class="hud panel" id="help">
  <div><b>클릭</b>한 곳으로 걷기 · 드래그로 시점</div>
  <div><b>물레를 클릭</b>하면 걸어가서 앉기</div>
  <div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 걷기 · <kbd>E</kbd> 앉기/일어나기</div>
  <div><b>물레 앞:</b> <kbd>1</kbd>–<kbd>5</kbd> 도구 · <kbd>Space</kbd> 물레 켜기</div>
</div>

<div class="hud panel" id="workPanel" hidden>
  <div id="wpMain"><button class="ghost sq" id="wpPrev" type="button" aria-label="이전 작품">‹</button><div id="wpInfo">내 작품</div><button class="ghost sq" id="wpNext" type="button" aria-label="다음 작품">›</button></div>
  <div class="btnrow" id="wpActs"><button class="primary" id="wpView" type="button">크게 보기</button><button class="ghost" id="wpDel" type="button">지우기</button><button class="ghost" id="wpClose" type="button">닫기</button></div>
  <div class="btnrow" id="wpConfirm" hidden><span>지우면 되돌릴 수 없어요</span><button class="danger" id="wpYes" type="button">지우기</button><button class="ghost" id="wpNo" type="button">취소</button></div>
</div>
<div id="viewer" hidden><canvas id="vc" aria-label="작품 크게 보기"></canvas>
  <button id="vClose" type="button" aria-label="닫기">✕</button>
  <div class="panel" id="vBar"><div id="vInfo">작품</div><div id="vHint">드래그해서 돌려 보기 · 두 손가락이나 휠로 확대</div></div>

<div class="hud" id="goWork" hidden><button id="goWorkBtn" type="button">내 작품 보러 가기 →</button></div>

  <div class="hud panel" id="tip">물레를 돌린 뒤, 흙을 누르고 있으면 중심이 잡혀요</div>

    <div class="sliders">
      <div class="sl" id="rpmWrap"><label for="rpm">물레 속도 <output id="rpmOut">0 rpm</output></label><input id="rpm" type="range" min="0" max="250" step="5" value="0"></div>
      <div class="sl"><label for="finger">손끝 크기 <output id="fingerOut">8 mm</output></label><input id="finger" type="range" min="4" max="20" step="1" value="8"></div>
    </div>

      <div class="ro"><span>중심</span><strong id="sCenter">0%</strong><div class="meter"><i id="mCenter"></i></div></div>
      <div class="ro"><span>높이</span><strong id="sH">0 cm</strong></div>
      <div class="ro"><span>지름</span><strong id="sD">0 cm</strong></div>
      <div class="ro"><span>벽 두께</span><strong id="sT">—</strong></div>
    </div>
    <div class="btnrow"><button class="primary" id="saveBtn" type="button">선반에 올리기</button><button class="ghost" id="resetBtn" type="button">새 흙</button><button class="ghost" id="standBtn" type="button">일어나기</button></div>
  </div>
  <div class="hud panel" id="tools" role="toolbar" aria-label="물레 도구">
    <button type="button" data-tool="center" aria-pressed="true">중심잡기<small>누르고 있기</small></button>
    <button type="button" data-tool="open" aria-pressed="false">구멍 뚫기<small>누르고 있기</small></button>
    <button type="button" data-tool="flat" aria-pressed="false">바닥 펴기<small>안쪽 바닥 넓히기</small></button>
    <button type="button" data-tool="pull" aria-pressed="false">벽 올리기<small>위로 끌기</small></button>
    <button type="button" data-tool="shape" aria-pressed="false">모양 잡기<small>윤곽 따라 끌기</small></button>
  </div>
</div>
<div class="hud panel" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const $ = id => document.getElementById(id);
if(!window.THREE){ $('loading').textContent='3D 엔진을 불러오지 못했어요. 새로고침해 주세요.'; return; }
$('loading').remove();

const canvas = $('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.background = new THREE.Color('#2a2826');
scene.fog = new THREE.Fog('#2a2826', 14, 26);
const camera = new THREE.PerspectiveCamera(55, 1, 0.02, 60);

function resize(){
  const w=innerWidth,h=innerHeight;
  renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix();
}
addEventListener('resize',resize); resize();

/* ---------- textures ---------- */
function canvasTex(w,h,draw,repeat){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding;
  if(repeat){ t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(repeat[0],repeat[1]); }
  t.anisotropy=4; return t;
}
const rnd=(a,b)=>a+Math.random()*(b-a);
// natural light oak, wide planks with cathedral grain, knots and pin knots (drawn procedurally)
const floorTex = canvasTex(1024,1024,(g,w,h)=>{
  const rows=6, ph=h/rows;
  const seeded=seed=>()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; };
  function plank(ox,y,len,seed){
    const R=seeded(seed), rr=(a,b)=>a+R()*(b-a);
    const light=rr(66,76), hue=rr(31,36);
    g.save(); g.beginPath(); g.rect(ox,y,len,ph); g.clip();
    g.fillStyle=`hsl(${hue},44%,${light}%)`; g.fillRect(ox,y,len,ph);
    // soft tonal streaks along the board
    for(let k=0;k<6;k++){ g.fillStyle=`hsla(${hue},40%,${light+rr(-8,6)}%,.25)`; g.fillRect(ox,y+rr(0,ph),len,rr(4,22)); }
    // cathedral grain: nested arches around a centre line, plus gentle waves
    const yc=y+rr(ph*.3,ph*.7), cx=ox+rr(len*.2,len*.8), archW=rr(len*.08,len*.18), archH=rr(ph*.25,ph*.55);
    for(let k=0;k<46;k++){
      const y0=y+(k+R()*.6)/46*ph, d=(y0-yc)/ph, sx=archW*(1+Math.abs(d)*5), sgn=d<0?-1:1;
      g.strokeStyle=`hsla(${hue-3},42%,${light-rr(14,26)}%,${rr(.18,.42)})`; g.lineWidth=rr(.6,1.7);
      g.beginPath();
      const ph1=rr(0,6), amp=rr(.5,2.5);

    const nk=R()<.7?1+(R()<.3?1:0):0;

  const darkWood=new THREE.MeshStandardMaterial({color:'#5a2f12',roughness:.6});

    for(let i=0;i<60;i++){ g.fillStyle=`rgba(${rnd(120,170)|0},${rnd(110,150)|0},${rnd(100,140)|0},.25)`; g.beginPath(); g.arc(rnd(0,w),rnd(0,h),rnd(6,20),0,7); g.fill(); }
  },[2,2])});
  const archShape=(w,hs,r,inset=0)=>{ const sh=new THREE.Shape(); sh.moveTo(-w/2,0); sh.lineTo(w/2,0); sh.lineTo(w/2,hs); sh.absarc(0,hs,r,0,Math.PI,false); sh.lineTo(-w/2,0); return sh; };
  const ext=(sh,dep)=>new THREE.ExtrudeGeometry(sh,{depth:dep,bevelEnabled:true,bevelThickness:.006,bevelSize:.006,bevelSegments:2,curveSegments:32});
  const mk=(geo,mat,x,y,z)=>{ const m=new THREE.Mesh(geo,mat); m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true; dg.add(m); return m; };

  // slim dark-wood casing hugging the arch (no stone surround)
  { const cs=archShape(DW+.1,DH,AR+.05); cs.holes.push(archShape(DW,DH,AR)); mk(ext(cs,.03),darkWood,0,0,0); }

    else { leaf.moveTo(0,0); leaf.lineTo(LW,0); leaf.lineTo(LW,DH); leaf.absarc(0,DH,AR,0,Math.PI/2,false); leaf.lineTo(0,0); }
    // glass hole: from 0.95m up to the arch, following a smaller arch

function potGeo(outer,wall){
  const pts=[new THREE.Vector2(0.001,0)];
  outer.forEach(([r,y])=>pts.push(new THREE.Vector2(r,y)));
  const top=outer[outer.length-1];
  pts.push(new THREE.Vector2(top[0]-wall/2,top[1]+wall*.4));
  for(let i=outer.length-1;i>=0;i--){ const [r,y]=outer[i]; if(y<wall*1.4) break; pts.push(new THREE.Vector2(Math.max(.002,r-wall),y)); }
  pts.push(new THREE.Vector2(.001,wall*1.4));
  return new THREE.LatheGeometry(pts,48);
}

      const n=jit?1+(Math.random()-.5)*jit:1;
      p.setXYZ(i,sp(v.x,e)*hx*n,sp(v.y,e*1.2)*hy*n,sp(v.z,e*.7)*hz); }

/* ---------- clay model ---------- */
const N=48, FLOOR=.011, MIN_WALL=.0045;
let fingerMM=8;
function newClay(){
  const r=new Float32Array(N), H=.105;
  // a smooth, slightly lumpy profile (no row-by-row jitter, which showed as fine horizontal lines)
  const ph=rnd(0,6.28), amp=rnd(.0015,.003);
  for(let i=0;i<N;i++){ const t=i/(N-1); r[i]=.074*(1-.38*t*t)+amp*Math.sin(t*4.2+ph); }
  const c={r,H,tw:.024,open:0,center:0,flat:0,V0:0};
  c.V0=vol(c); return c;
}
function innerR(c,i,k){ return Math.max(.002,c.r[i]-c.tw)*k; }
function vol(c){
  const dh=c.H/(N-1); let v=0;
  const k=Math.min(1,c.open*2.2), yb=c.H-c.open*(c.H-FLOOR);
  for(let i=0;i<N-1;i++){
    const rm=(c.r[i]+c.r[i+1])/2; v+=Math.PI*rm*rm*dh;
    if(c.open>.02){ const y0=i*dh,y1=y0+dh; if(y1>yb){ const f=(y1-Math.max(y0,yb))/dh; const ri=Math.max(.002,rm-c.tw)*k; v-=Math.PI*ri*ri*dh*f; } }
  }
  return v;
}
function conserve(c){ for(let k=0;k<3;k++){ c.H=Math.min(.38,Math.max(.03,c.H*c.V0/vol(c))); } }
function smooth(c,k){
  k=Math.min(.45,k); const r=c.r, n=new Float32Array(r);
  for(let i=1;i<N-1;i++) n[i]=r[i]+k*((r[i-1]+r[i+1])/2-r[i]);
  n[N-1]=r[N-1]+k*(r[N-2]-r[N-1])*.5; c.r.set(n);
}
function clampR(c){ const minR=c.open>.5?c.tw+.006:.012; for(let i=0;i<N;i++) c.r[i]=Math.min(.17,Math.max(minR,c.r[i])); }
function clayGeo(c){
  const V=(x,y)=>new THREE.Vector2(x,y), dh=c.H/(N-1), pts=[V(.0005,0)];
  for(let i=0;i<N;i++) pts.push(V(c.r[i],i*dh));
  if(c.open<.02){
    pts.push(V(c.r[N-1]*.6,c.H+.004)); pts.push(V(.0005,c.H+.006));
  } else {
    const k=Math.min(1,c.open*2.2), yb=c.H-c.open*(c.H-FLOOR);
    pts.push(V((c.r[N-1]+innerR(c,N-1,k))/2,c.H+Math.min(.004,c.tw*.4)));
    let last=innerR(c,N-1,k);
    for(let i=N-1;i>=0;i--){ const y=i*dh; if(y<yb) break; last=innerR(c,i,k); pts.push(V(last,y)); }
    pts.push(V(last*.75,yb)); pts.push(V(.0005,yb));
  }
  // map the texture by real surface length so the top and inside don't stretch into streaks
  const SEG=72, geo=new THREE.LatheGeometry(pts,SEG), np=pts.length, uv=geo.attributes.uv;
  const cum=[0]; for(let k=1;k<np;k++) cum.push(cum[k-1]+pts[k].distanceTo(pts[k-1]));
  for(let i=0;i<=SEG;i++) for(let j=0;j<np;j++) uv.setY(i*np+j,cum[j]/.3);
  uv.needsUpdate=true;
  return geo;
}
function ensureClay(w){
  if(!w.clay){ w.clay=newClay(); }
  if(!w.mesh){ w.mesh=new THREE.Mesh(clayGeo(w.clay),M.clay); w.mesh.castShadow=w.mesh.receiveShadow=true; w.mesh.position.y=.015; w.head.add(w.mesh); }
}
function rebuild(w){ w.mesh.geometry.dispose(); w.mesh.geometry=clayGeo(w.clay); }

    const map={Digit1:'center',Digit2:'open',Digit3:'flat',Digit4:'pull',Digit5:'shape'};

let silentEl=null;
function silentWav(){ const n=800,b=new ArrayBuffer(44+n*2),v=new DataView(b),w=(o,t)=>{ for(let i=0;i<t.length;i++) v.setUint8(o+i,t.charCodeAt(i)); };
  w(0,'RIFF'); v.setUint32(4,36+n*2,true); w(8,'WAVE'); w(12,'fmt '); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,8000,true); v.setUint32(28,16000,true); v.setUint16(32,2,true); v.setUint16(34,16,true); w(36,'data'); v.setUint32(40,n*2,true);

function audio(){
  try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){}
  if(!audioCtx){ audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    try{ const b=audioCtx.createBuffer(1,1,22050), src=audioCtx.createBufferSource(); src.buffer=b; src.connect(audioCtx.destination); src.start(0); }catch(e){} }

const mtof=m=>440*Math.pow(2,(m-69)/12);
function marimba(ac,dest,m,t,vol,len=.45){
  const f=mtof(m);
  [[1,1,'sine'],[4,.25,'sine'],[2,.12,'triangle']].forEach(([h,a,type],k)=>{
    const o=ac.createOscillator(), g=ac.createGain(); o.type=type; o.frequency.value=f*h;
    const v=vol*a, d=k?len*.25:len;

    o.connect(g); g.connect(dest); o.start(t); o.stop(t+d+.05); });
}
function softTick(ac,dest,t,vol){
  const len=.04, buf=ac.createBuffer(1,Math.ceil(ac.sampleRate*len),ac.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);

// 4 bars of eighth notes (C - Am - F - G), melody / bass / off-beat chord plucks
const MEL=[72,null,76,79, 76,null,74,72,  69,72,null,76, 74,72,69,null,  65,69,72,null, 74,72,69,72,  74,null,71,74, 79,77,74,71];
const ROOT=[48,45,41,43], CH=[[60,64,67],[57,60,64],[53,57,60],[55,59,62]];
const STEP=.25; // eighth note at 120 bpm
function bgmSchedule(){
  const ac=audioCtx; if(!bgm.on||!ac) return;
  while(bgm.next<ac.currentTime+.4){
    const t=bgm.next, s=bgm.step%32, bar=(s/8)|0, b=s%8;
    if(MEL[s]!=null) marimba(ac,bgm.master,MEL[s],t,.5,.5);
    if(b===0||b===3||b===4||b===6) marimba(ac,bgm.master,ROOT[bar]+(b===6?7:0),t,.55,.35);
    if(b===2||b===6) CH[bar].forEach(n=>marimba(ac,bgm.master,n,t,.12,.22));
    softTick(ac,bgm.master,t,b%2?.06:.03);

function setMusic(on){

    if(!bgm.master){ bgm.master=ac.createGain(); const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=3200; bgm.master.connect(lp); lp.connect(ac.destination); }

function nearestWheel(){

  wheels.forEach(w=>{ const d=Math.hypot(avatar.position.x-w.seat.x,avatar.position.z-w.seat.z); if(d<bd){bd=d;best=w;} });
  return best;
}

function clayHit(w){

// widen (+) or narrow (-) the wall around one height by a small amount, as wide as the fingertip

function workClay(w,dt){

  marker.visible=false;

  const dh=c.H/(N-1), idx=Math.max(0,Math.min(N-1,Math.round(hit.y/dh)));

    const sr=(tool==='shape'||tool==='flat')?Math.max(c.r[idx]*.6,Math.min(.17,hit.r)):c.r[idx];

    changed=true;

    if(c.open<.95) warn('구멍을 먼저 뚫어 주세요');

      const target=Math.max(0,Math.min(1,(c.H-hit.y)/(c.H-FLOOR)));

    }

    if(c.open<.95) warn('구멍을 먼저 뚫어주세요');

    else if(pullAcc>0){
      if(c.tw<=MIN_WALL+.0002) warn('벽이 4.5mm예요. 더 얇으면 주저앉아요');

}
