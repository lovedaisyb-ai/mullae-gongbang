<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}[hidden]{display:none!important}</style>
</head>
<body>
<title>산사 기본 가람</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500&display=swap">
<style>
/* 한 화면 3D 걷기 공간: 전각 뷰어와 같은 먹빛 안내판, 뇌록을 강조색으로 고정 */
:root{--ink:#1d211f;--panel:rgba(29,33,31,.72);--paper:#ece6d8;--muted:#b7b4a6;--noerok:#7f9a8a;--line:rgba(236,230,216,.22);
 --display:"Noto Serif KR","Apple SD Gothic Neo",serif;--body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color-scheme:dark}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
body{position:fixed;inset:0;background:var(--ink);color:var(--paper);font-family:var(--body);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#fade{position:fixed;inset:0;background:var(--ink);opacity:0;pointer-events:none;transition:opacity .28s}
#fade.on{opacity:1}
.top{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none}
#place{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:9px 13px;min-width:0;max-width:min(330px,62vw);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#place h1{margin:0;font:700 clamp(18px,3vw,23px)/1.25 var(--display)}
#place p{margin:3px 0 0;font-size:12.5px;line-height:1.5;color:var(--paper)}
.time{display:flex;gap:4px;pointer-events:auto;flex:none}
button{font:500 13px var(--body);color:var(--paper);background:var(--panel);border:1px solid var(--line);padding:8px 11px;border-radius:3px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--paper)}
button:focus-visible{outline:2px solid var(--paper);outline-offset:2px}
button[aria-pressed="true"]{background:var(--noerok);color:#16201b;border-color:var(--noerok)}
.bottom{position:fixed;left:0;right:0;bottom:0;padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:linear-gradient(transparent,rgba(20,23,22,.72));pointer-events:none}
.bottom>*{pointer-events:auto}
#hint{pointer-events:none;margin-left:auto;font-size:12px;color:var(--paper)}
#act{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(74px + env(safe-area-inset-bottom,0px));background:var(--noerok);color:#16201b;border-color:var(--noerok);font-size:15px;padding:11px 20px;border-radius:999px}
#joy{position:fixed;display:none;left:max(22px,env(safe-area-inset-left,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:112px;height:112px;border-radius:50%;background:rgba(29,33,31,.42);border:1px solid var(--line);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(127,154,138,.72);border:1px solid var(--paper);pointer-events:none}
#lost{position:fixed;inset:0;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;background:var(--ink);text-align:center;padding-inline:24px}#lost p{margin:0;font-size:15px}
#hallLoad{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:var(--paper);font:500 16px var(--body);pointer-events:none}
#mapPanel{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(62px + env(safe-area-inset-top,0px));width:min(320px,calc(100vw - 32px));box-sizing:border-box;padding:12px;background:rgba(22,25,24,.82);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
#mapPanel h2{margin:0 0 8px;font:500 13px var(--body);color:var(--paper)}
#mapSvg{display:block;width:100%;height:auto;max-height:calc(100dvh - 240px)}
@media (max-width:640px){#mapPanel{top:calc(150px + env(safe-area-inset-top,0px))}}
#status{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding-inline:24px;color:var(--muted);font-size:15px;pointer-events:none}
@media (pointer:coarse){#hint{display:none}#act{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
@media (max-width:640px){.top{flex-direction:column;align-items:stretch;gap:6px}#place{max-width:none}.time{align-self:flex-end}button{padding:8px 9px;font-size:12.5px}.bottom{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}}
@media (prefers-reduced-motion:reduce){#fade{transition:none}}
</style>

<canvas id="c" tabindex="0" aria-label="산사 3D 공간. 끌어서 둘러보고, 땅을 눌러 걸어갑니다."></canvas>
<div class="top">
  <div id="place" role="status" aria-live="polite"><h1 id="pName">숲길</h1><p id="pDesc">일주문을 지나 절 마당으로 걸어 올라갑니다.</p></div>
  <div class="time" role="group" aria-label="시간대">
    <button id="t-day" type="button" aria-pressed="false">낮</button>
    <button id="t-dusk" type="button" aria-pressed="true">해 질 녘</button>
    <button id="t-dawn" type="button" aria-pressed="false">새벽</button>
  </div>
</div>
<button id="act" type="button" hidden>범종 치기</button>
<div id="joy" aria-hidden="true"><div id="knob"></div></div>
<nav class="bottom" aria-label="바로 가기">
  <button id="mapBtn" type="button" aria-pressed="false" aria-controls="mapPanel">지도</button>
  <button type="button" data-go="iljumun">일주문</button>
  <button type="button" data-go="bulimun">불이문</button>
  <button type="button" data-go="madang">마당</button>
  <button type="button" data-go="daeung">대웅전</button>
  <button type="button" data-go="beop">법당 안</button>
  <button type="button" data-go="jong">범종각</button>
  <span id="hint">땅을 클릭하거나 WASD로 걷기 · 드래그로 둘러보기 · 휠로 확대</span>
</nav>
<aside id="mapPanel" aria-label="경내 지도" hidden><h2>경내 지도</h2><svg id="mapSvg" viewBox="-31 -30 62 57" role="img" aria-label="대웅전이 북쪽에 있는 경내 배치도"></svg></aside>
<div id="fade"></div>
<div id="hallLoad" hidden>법당 문을 여는 중입니다</div>
<div id="status">산문을 여는 중입니다</div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {mergeGeometries} from 'three/addons/utils/BufferGeometryUtils.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {DRACOLoader} from 'three/addons/loaders/DRACOLoader.js';
import {MeshoptDecoder} from 'three/addons/libs/meshopt_decoder.module.js';

const $=id=>document.getElementById(id), canvas=$('c');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const coarse=matchMedia('(pointer:coarse)').matches;
let renderer;
try{ renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'}); }
catch(e){ $('status').textContent='이 기기에서는 3D 화면을 열 수 없습니다. 다른 브라우저로 열어 주세요.'; throw e; }
try{ await Promise.race([document.fonts.load('700 64px "Noto Serif KR"','大雄殿一柱門不二尋劍堂說禪梵鍾閣'),new Promise(r=>setTimeout(r,1500))]); }catch(e){}

let pxr=Math.min(devicePixelRatio,2);renderer.setPixelRatio(pxr);
// 그래픽 메모리가 넘쳐 화면이 꺼지면 검은 화면으로 두지 않고 복구하거나 안내한다
{let timer=0;const box=document.createElement('div');box.id='lost';box.hidden=true;box.innerHTML='<p>그래픽 메모리가 부족해 화면이 꺼졌습니다.</p><button id="lostBtn" type="button">다시 열기</button>';document.body.append(box);box.querySelector('button').onclick=()=>location.reload();
  canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();timer=setTimeout(()=>{box.hidden=false;},2500);});
  canvas.addEventListener('webglcontextrestored',()=>{clearTimeout(timer);box.hidden=true;window.__shadowRedo&&window.__shadowRedo();});}
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap; renderer.shadowMap.autoUpdate=false;

let scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(55,1,.1,900);
scene.fog=new THREE.Fog(0,50,190);
function size(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w<h?68:52;camera.updateProjectionMatrix();}
addEventListener('resize',size); size();

/* ---------- 작은 도구 ---------- */
let seed=20261106;
const R=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
const rr=(a,b)=>a+R()*(b-a);
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const sm=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
function tex(w,h,draw,repeat){
  const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=renderer.capabilities.getMaxAnisotropy()>4?4:1;
  if(repeat){t.wrapS=t.wrapT=THREE.RepeatWrapping;}
  return t;
}

/* ---------- 재질 ---------- */
const stoneTex=tex(256,256,(g,w,h)=>{g.fillStyle='#a8a498';g.fillRect(0,0,w,h);
  for(let i=0;i<5000;i++){g.fillStyle=`rgba(${R()<.5?'60,58,52':'232,228,216'},${rr(.03,.13)})`;g.fillRect(rr(0,w),rr(0,h),rr(1,3),rr(1,3));}
  g.strokeStyle='rgba(62,58,50,.5)';g.lineWidth=2;for(let y=0;y<h;y+=64){g.beginPath();g.moveTo(0,y);g.lineTo(w,y);g.stroke();for(let x=(y/64)%2?0:64;x<w;x+=128){g.beginPath();g.moveTo(x,y);g.lineTo(x,y+64);g.stroke();}}},true);
const graniteTex=tex(256,256,(g,w,h)=>{g.fillStyle='#b4b0a5';g.fillRect(0,0,w,h);for(let i=0;i<7000;i++){g.fillStyle=`rgba(${R()<.5?'70,68,62':'238,234,224'},${rr(.05,.16)})`;g.fillRect(rr(0,w),rr(0,h),2,2);}},true);
const plasterTex=tex(128,128,(g,w,h)=>{g.fillStyle='#e4dccb';g.fillRect(0,0,w,h);for(let i=0;i<900;i++){g.fillStyle=`rgba(120,105,85,${rr(.01,.05)})`;g.fillRect(rr(0,w),rr(0,h),rr(2,8),rr(1,4));}},true);
const pathTex=tex(256,256,(g,w,h)=>{g.fillStyle='#8d8678';g.fillRect(0,0,w,h);
  for(let y=0;y<h;y+=51)for(let x=((y/51)%2)*42;x<w;x+=85){g.fillStyle=`hsl(40,${rr(6,12)}%,${rr(58,70)}%)`;g.fillRect(x+2,y+2,81,47);}},true);
const yardTex=tex(256,256,(g,w,h)=>{g.fillStyle='#c6b797';g.fillRect(0,0,w,h);for(let i=0;i<9000;i++){g.fillStyle=`rgba(${R()<.5?'110,92,66':'236,226,204'},${rr(.05,.2)})`;g.fillRect(rr(0,w),rr(0,h),rr(1,3),rr(1,3));}},true);
const tileTex=tex(256,256,(g,w,h)=>{const n=4,cw=w/n;for(let i=0;i<n;i++){const gr=g.createLinearGradient(i*cw,0,(i+1)*cw,0);gr.addColorStop(0,'#2e3236');gr.addColorStop(.28,'#5b6065');gr.addColorStop(.5,'#6d7276');gr.addColorStop(.72,'#565b60');gr.addColorStop(1,'#2a2e32');g.fillStyle=gr;g.fillRect(i*cw,0,cw,h);}
  g.fillStyle='rgba(20,22,26,.4)';for(let y=0;y<h;y+=64)g.fillRect(0,y,w,5);},true);
const tileBump=tex(128,128,(g,w,h)=>{const n=4,cw=w/n;for(let i=0;i<n;i++){const gr=g.createLinearGradient(i*cw,0,(i+1)*cw,0);gr.addColorStop(0,'#000');gr.addColorStop(.5,'#fff');gr.addColorStop(1,'#000');g.fillStyle=gr;g.fillRect(i*cw,0,cw,h);}},true);tileBump.colorSpace=THREE.NoColorSpace;

// 모로단청: 뇌록 바탕에 양 끝 머리초만, 가운데는 비워 둔다
const NOK='#6c9483',JU='#9c3b2c',HW='#cfa84f',MUK='#2e2c2a',BAK='#eee7d8',GUN='#3c5a78';
const moroTex=tex(1024,96,(g,w,h)=>{g.fillStyle=NOK;g.fillRect(0,0,w,h);g.fillStyle=BAK;g.fillRect(0,5,w,3);g.fillRect(0,h-8,w,3);
  const head=(x,dir)=>{const cy=h/2;[[150,GUN],[132,BAK],[118,JU]].forEach(([l,c])=>{g.fillStyle=c;dir>0?g.fillRect(x,0,l,h):g.fillRect(x-l,0,l,h);});
    [[38,JU],[31,BAK],[25,HW],[16,JU],[8,HW]].forEach(([r,c],i)=>{g.fillStyle=c;g.beginPath();g.arc(x+dir*58,cy,r,0,7);g.fill();});
    g.fillStyle=BAK;for(let k=0;k<3;k++){g.save();g.translate(x+dir*(102+k*11),cy);g.rotate(Math.PI/4);g.fillRect(-7,-7,14,14);g.restore();}};
  head(0,1);head(w,-1);},false);
  // 나뭇결: 널판마다 산 모양 결, 잔결, 옹이를 그린다
  const grain=(g,x,y,W,Hh,dark=0,kp=1)=>{const hue=rr(25,31),li=rr(39,46)-dark;g.save();g.beginPath();g.rect(x,y,W,Hh);g.clip();g.fillStyle=`hsl(${hue},52%,${li}%)`;g.fillRect(x,y,W,Hh);
    for(let k=0;k<8;k++){g.fillStyle=`hsla(${hue},48%,${li+rr(-9,8)}%,.3)`;g.fillRect(x,y+rr(0,Hh),W,rr(3,Hh*.22));}
    const cx=x+rr(W*.2,W*.8),yc=y+rr(Hh*.3,Hh*.7),aw=rr(W*.1,W*.2),ah=rr(Hh*.2,Hh*.42),n=Math.max(16,Hh/3.4|0);
    for(let k=0;k<n;k++){const y0=y+(k+R()*.7)/n*Hh,d=(y0-yc)/Hh,sx=aw*(1+Math.abs(d)*5),sg=d<0?-1:1,p1=rr(0,6),am=rr(.4,2.2);g.strokeStyle=`hsla(${hue-5},55%,${li-rr(13,24)}%,${rr(.22,.55)})`;g.lineWidth=rr(.6,1.6);g.beginPath();
      for(let i=0;i<=34;i++){const px=x+W*i/34,py=y0+Math.sin((px-x)/W*6+p1)*am+sg*ah*Math.exp(-(((px-cx)/sx)**2))*(1-Math.min(1,Math.abs(d)*1.6));i?g.lineTo(px,py):g.moveTo(px,py);}g.stroke();}
    for(let k=0;k<W*Hh/320;k++){g.fillStyle=`rgba(60,30,12,${rr(.05,.2)})`;g.fillRect(x+rr(0,W),y+rr(0,Hh),rr(4,16),1);}
    for(let q=0,nk=(R()<.85*kp?1:0)+(W>400&&R()<.6*kp?1:0);q<nk;q++){const kx=x+rr(W*.12,W*.88),ky=y+rr(Hh*.25,Hh*.75),kr=rr(6,Math.min(15,Hh*.16));   // 옹이: 둘레로 결이 휘고 가운데가 짙다
      for(let r=7;r>=1;r--){g.strokeStyle=`hsla(${hue-7},55%,${li-8-r*2.6}%,${.72-r*.05})`;g.lineWidth=rr(1,1.8);g.beginPath();g.ellipse(kx,ky,kr*(1+r*.72)*1.35,kr*(1+r*.4)*.72,rr(-.08,.08),0,7);g.stroke();}
      g.fillStyle='#5c3115';g.beginPath();g.ellipse(kx,ky,kr*1.3,kr*.72,rr(-.15,.15),0,7);g.fill();g.strokeStyle='#2b1508';g.lineWidth=1.6;for(let r=.25;r<1;r+=.25){g.beginPath();g.ellipse(kx,ky,kr*1.3*r,kr*.72*r,0,0,7);g.stroke();}g.fillStyle='#1e0e05';g.beginPath();g.ellipse(kx,ky,kr*.34,kr*.2,0,0,7);g.fill();}
    g.restore();};
  const pineT=tex(1024,512,(g,w,h)=>{for(let y=0;y<h;y+=128){let x=-rr(0,300);while(x<w){const l=rr(420,760);grain(g,x,y,l,127);g.fillStyle='rgba(40,20,8,.6)';g.fillRect(x+l-1,y,1.5,128);x+=l;}g.fillStyle='rgba(40,20,8,.55)';g.fillRect(0,y+127,w,1.5);}},true);
const hanjiT=tex(256,256,(g,w,h)=>{g.fillStyle='#e6dcc6';g.fillRect(0,0,w,h);for(let i=0;i<620;i++){const x=rr(0,w),y=rr(0,h),l=rr(12,50),a=rr(0,6.283);g.strokeStyle=R()<.65?`rgba(255,255,255,${rr(.2,.55)})`:`rgba(135,100,58,${rr(.08,.22)})`;g.lineWidth=rr(.5,1.4);g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+Math.cos(a)*l*.5+rr(-7,7),y+Math.sin(a)*l*.5+rr(-7,7),x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke();}for(let i=0;i<46;i++){g.fillStyle=`rgba(110,78,40,${rr(.1,.24)})`;g.beginPath();g.ellipse(rr(0,w),rr(0,h),rr(1,3),rr(.5,1.2),rr(0,3),0,7);g.fill();}},true);
const lattTex=tex(256,256,(g,w,h)=>{g.fillStyle='#d9cfba';g.fillRect(0,0,w,h);g.fillStyle='#5f4632';for(let x=0;x<=w;x+=16)g.fillRect(x-1.5,0,3,h);g.fillRect(0,0,w,10);g.fillRect(0,h-40,w,40);g.fillRect(0,h*.5,w,8);g.fillRect(w/2-5,0,10,h);});

const mats={
  stone:new THREE.MeshStandardMaterial({map:stoneTex,roughness:.95}),
  granite:new THREE.MeshStandardMaterial({map:graniteTex,roughness:.9}),
  plaster:new THREE.MeshStandardMaterial({map:plasterTex,roughness:1}),
  wood:new THREE.MeshStandardMaterial({color:'#6b4a33',roughness:.8}),
  moro:new THREE.MeshStandardMaterial({map:moroTex,roughness:.75}),
  nok:new THREE.MeshStandardMaterial({color:NOK,roughness:.8}),
  pine:new THREE.MeshStandardMaterial({map:pineT,roughness:.42}),
  doorW:new THREE.MeshStandardMaterial({map:pineT,color:'#a78a6c',roughness:.5}),
  doorV:new THREE.MeshStandardMaterial({map:pineT,color:'#a78a6c',roughness:.5}),
  doorBack:new THREE.MeshStandardMaterial({color:'#1a100a',roughness:.9}),
  hanji:new THREE.MeshStandardMaterial({map:hanjiT,color:'#efe6d4',roughness:.95}),
  hanjiGlow:new THREE.MeshStandardMaterial({map:hanjiT,color:'#b8a07a',emissive:'#ffd79a',emissiveMap:hanjiT,emissiveIntensity:.5,roughness:.95}),
  latt:new THREE.MeshStandardMaterial({map:lattTex,roughness:.85}),
  tile:new THREE.MeshStandardMaterial({map:tileTex,bumpMap:tileBump,bumpScale:1.6,roughness:.68}),
  ridge:new THREE.MeshStandardMaterial({color:'#3b3f43',roughness:.7}),
  iron:new THREE.MeshStandardMaterial({color:'#4b5148',roughness:.45,metalness:.7}),
};
mats.under=new THREE.MeshStandardMaterial({color:'#4f6f60',roughness:.9,side:THREE.BackSide});
const lanternGlow=new THREE.MeshBasicMaterial({color:'#ffcb7a',transparent:true,opacity:.62,depthWrite:false,toneMapped:false});
const maruTex=tex(256,256,(g,w,h)=>{g.fillStyle='#7a5234';g.fillRect(0,0,w,h);for(let y=0;y<h;y+=64)for(let x=(y/64%2)*96;x<w+192;x+=192){g.fillStyle=`hsl(26,${rr(34,44)}%,${rr(29,38)}%)`;g.fillRect(x-192+1,y+1,190,62);}

function doorHit(cx,cy){ndc.set(cx/innerWidth*2-1,-(cy/innerHeight)*2+1);ray.setFromCamera(ndc,camera);const o=ray.ray.origin,d=ray.ray.direction,zp=mode==='in'?9:-13.46;
  const t=(zp-o.z)/d.z;if(t<=0)return false;const x=o.x+d.x*t,y=o.y+d.y*t;return mode==='in'?Math.abs(x)<2&&y<3.7:o.z>zp&&Math.abs(x)<6.4&&y>1.5&&y<5;}
function matHit(cx,cy){ndc.set(cx/innerWidth*2-1,-(cy/innerHeight)*2+1);ray.setFromCamera(ndc,camera);const o=ray.ray.origin,d=ray.ray.direction;if(d.y>=0)return null;const t=(.12-o.y)/d.y,x=o.x+d.x*t,z=o.z+d.z*t;return matSpots.find(q=>Math.abs(x-q[0])<.58&&Math.abs(z-q[1])<.64)||null;}
function tapGo(cx,cy){if(busy)return;
  if(mode==='in'){const q=matHit(cx,cy);if(q){bow=null;tgt.x=null;pending=null;marker.visible=false;P.x=q[0];P.z=q[1];P.y=.12;P.face=0;return;}}
  if(doorHit(cx,cy)){const dest=mode==='in'?{x:0,z:7.8}:{x:0,z:-12.4};if(Math.hypot(P.x-dest.x,P.z-dest.z)<3.6){mode==='in'?exitHall():enterHall();return;}tgt.x=dest.x;tgt.z=dest.z;pending=mode==='in'?exitHall:enterHall;marker.position.set(dest.x,heightAt(dest.x,dest.z)+.12,dest.z);marker.visible=true;return;}
  pending=null;ndc.set(cx/innerWidth*2-1,-(cy/innerHeight)*2+1);ray.setFromCamera(ndc,camera);const o=ray.ray.origin,d=ray.ray.direction;
  for(let t=1;t<160;t+=.5){const x=o.x+d.x*t,y=o.y+d.y*t,z=o.z+d.z*t;if(y<=heightAt(x,z)+.02){const pt={x,z};solve(pt);tgt.x=pt.x;tgt.z=pt.z;marker.position.set(pt.x,heightAt(pt.x,pt.z)+.12,pt.z);marker.visible=true;return;}if(inRect(x,z)&&y<7)return;}}
const J=$('joy'),K=$('knob');
function jm(e){const r=J.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),m=r.width/2-14,d=Math.hypot(dx,dy),s=d>m?m/d:1;joy.x=dx*s/m;joy.y=dy*s/m;K.style.transform=`translate(${dx*s}px,${dy*s}px)`;}
J.addEventListener('pointerdown',e=>{J.setPointerCapture(e.pointerId);jm(e);tgt.x=null;marker.visible=false;});J.addEventListener('pointermove',e=>{if(J.hasPointerCapture(e.pointerId))jm(e);});
const jend=()=>{joy.x=joy.y=0;K.style.transform='';};J.addEventListener('pointerup',jend);J.addEventListener('pointercancel',jend);

/* 매 장면 */
let camSnap=true,last=performance.now(),frN=0,frT=0;const camPos=new THREE.Vector3(),look=new THREE.Vector3();
function frame(now){
  const raw=now-last,dt=Math.min(.05,raw/1000);last=now;
  // 기기가 버거워하면 선명도를 한 단계씩 낮춘다(시작은 최대 2배)
  if(!document.hidden&&raw<400){frN++;frT+=raw;if(frN>=90){if(frT/frN>42&&pxr>1){pxr=Math.max(1,pxr-.35);renderer.setPixelRatio(pxr);size();}frN=frT=0;}}
  let ix=(key.KeyD||key.ArrowRight?1:0)-(key.KeyA||key.ArrowLeft?1:0)+joy.x, iz=(key.KeyS||key.ArrowDown?1:0)-(key.KeyW||key.ArrowUp?1:0)+joy.y;
  let mx=0,mz=0,walking=false;
  const il=Math.hypot(ix,iz);
  if(bow&&il>.08){bow=null;$('pDesc').textContent=ZONE[zone][1];}
  if(il>.08){tgt.x=null;pending=null;marker.visible=false;const s=Math.min(1,il);ix/=il;iz/=il;const sn=Math.sin(yaw),cs=Math.cos(yaw);
    mx=(-ix*cs-iz*sn)*s;mz=(ix*sn-iz*cs)*s;
  }else if(tgt.x!==null){const dx=tgt.x-P.x,dz=tgt.z-P.z,d=Math.hypot(dx,dz);if(d<.3){tgt.x=null;marker.visible=false;if(pending){const f=pending;pending=null;f();}}else{mx=dx/d;mz=dz/d;}}
  if(mx||mz){walking=true;const sp=key.ShiftLeft?6.4:4.4,ox=P.x,oz=P.z;P.x+=mx*sp*dt;P.z+=mz*sp*dt;solve(P);
    if(tgt.x!==null&&Math.hypot(P.x-ox,P.z-oz)<sp*dt*.15){tgt.x=null;pending=null;marker.visible=false;}
    const f=Math.atan2(-mx,-mz);let df=f-P.face;while(df>Math.PI)df-=6.283;while(df<-Math.PI)df+=6.283;P.face+=df*Math.min(1,dt*11);}
  P.y=lerp(P.y,heightAt(P.x,P.z),Math.min(1,dt*10));
  me.position.set(P.x,P.y,P.z);me.rotation.y=P.face;me.rotation.x=0;
  if(bow){bow.t+=dt;P.face=0;me.rotation.y=0;const k=Math.sin(Math.PI*Math.min(1,bow.t/3))**2;bowK=k;if(!rig){me.rotation.x=-k*1.2;me.position.y-=k*.42;}
    if(bow.t>=3.3){bow.t=0;bow.n++;if(bow.n>=3){bow=null;$('pDesc').textContent='삼배를 마쳤습니다.';}else moktak();}}
  if(!bow)bowK=0;
  if(mode==='out')lampFires.forEach((f,i)=>{const t=now*.001+i*2.3,a=reduced?0:Math.sin(t*11)+.5*Math.sin(t*23.3+i)+.3*Math.sin(t*4.7);f.fl.scale.set(.24*(1-.05*a),.5*(1+.13*a),1);f.fm.rotation=reduced?0:.07*Math.sin(t*6.3)+.05*Math.sin(t*13.1);f.gm.opacity=.8+.16*Math.sin(t*9+i)+.05*a;f.gl2.scale.setScalar(2.7*(1+.04*a));});
  if(mapMe&&!$('mapPanel').hidden){const ins=P.z>-31&&P.z<27&&Math.abs(P.x)<32;mapMe.style.display=ins?'':'none';mapMe.setAttribute('transform',`translate(${P.x.toFixed(2)} ${P.z.toFixed(2)}) rotate(${(-P.face*57.3).toFixed(0)})`);}
  if(sweeper&&mode==='out'){const w=sweeper;w.mix.update(dt);
    if(w.turn>0){w.turn-=dt;const goal=w.dir*Math.PI/2;let df=goal-w.rot;while(df>Math.PI)df-=6.283;while(df<-Math.PI)df+=6.283;w.rot+=df*Math.min(1,dt*3);}
    else{const near=Math.hypot(P.x-w.x-w.dir*.8,P.z-SWEEP.z)<.9;if(!near){w.x+=w.dir*SWEEP.speed*dt;if(Math.abs(w.x)>=SWEEP.x){w.x=Math.sign(w.x)*SWEEP.x;w.dir*=-1;w.turn=1.4;}}}
    w.gp.position.set(w.x,heightAt(w.x,SWEEP.z),SWEEP.z);w.gp.rotation.y=w.rot;w.hit.x=w.x;}
  if(rig)poseRig(dt,walking,now);
  if(mode==='in'&&!reduced)flames.forEach((f,i)=>{const t=now*.001+i*1.7,q=f.userData.s,a=Math.sin(t*11)+.5*Math.sin(t*23.3+i)+.3*Math.sin(t*4.7);f.scale.set(q*(1-.05*a),q*(1+.11*a),q*(1-.05*a));f.userData.m.rotation=.07*Math.sin(t*6.3)+.05*Math.sin(t*13.1);f.userData.g.material.opacity=.82+.13*Math.sin(t*9+i);});
  if(walking)phase+=dt*9.5;const sw=walking?Math.sin(phase)*.62:0;legL.rotation.x=sw*.6;legR.rotation.x=-sw*.6;armL.rotation.x=-sw*.7;armR.rotation.x=sw*.7;
  if(swing>.002){swing*=Math.exp(-dt*1.2);bellGroup.rotation.z=Math.sin(now*.0036)*.012*swing;}
  if(hit>0){hit-=dt;const t=hit/.45;striker.position.x=19.95-(1-Math.abs(t*2-1))*.62;}else striker.position.x=19.95;
  updateZone();
  // 카메라: 벽을 뚫지 않게 당겨 온다
  look.set(P.x,P.y+1.2,P.z);const cp=Math.cos(pitch);let d=dist;
  const vy=Math.sin(pitch);
  const dirx=-Math.sin(yaw)*cp, dirz=-Math.cos(yaw)*cp;
  for(let s=.05;s<=1;s+=.05){const t=dist*s,x=look.x+dirx*t,z=look.z+dirz*t;if(inRect(x,z)&&look.y+vy*t<7){d=Math.max(1.8,t-.5);break;}}
  camPos.set(look.x+dirx*d,Math.max(look.y+vy*d,heightAt(look.x+dirx*d,look.z+dirz*d)+.5),look.z+dirz*d);
  if(mode==='in'){camPos.y=Math.min(camPos.y,HALL.ceil-.9);camPos.x=clamp(camPos.x,-12.7,12.7);camPos.z=clamp(camPos.z,-8.7,8.8);}
  if(camSnap){camera.position.copy(camPos);camSnap=false;}else camera.position.lerp(camPos,Math.min(1,dt*9));
  camera.lookAt(look);
  if(mode==='out'&&shadowDirty){renderer.shadowMap.needsUpdate=true;shadowDirty=false;}
  renderer.render(scene,camera);
}
renderer.toneMappingExposure=curExp;
$('status').remove();
renderer.setAnimationLoop(frame);
window.__sansa={P,mode:()=>mode,enterHall,exitHall,bow:()=>bow,startBow,info:()=>renderer.info.render,go:(x,z,y=Math.PI,p=.2,dd=8)=>{P.x=x;P.z=z;P.y=heightAt(x,z);yaw=y;pitch=p;dist=dd;camSnap=true;},setLight};
</script>
