<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>공방 관리실</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap"><style>*,*::before,*::after{box-sizing:border-box}:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style><style>
/* Layout: a studio logbook — one column on a phone, a two-up grid on wider screens; numbers first, then trends, then people */
:root{
  --bg:#f3f6ee; --card:#ffffff; --ink:#23302a; --ink2:#5d6a62; --mute:#8b968f; --line:#dfe6d8;

}

  --bg:#171c19; --card:#212824; --ink:#eef2ec; --ink2:#b5c0b8; --mute:#87928b; --line:#323b35;
  --accent:#f08a45; --accent-soft:#4a2e1c; --celadon:#7fb5a2; --celadon-soft:#26342e; --grid:#2b332e;
  --good:#5fc28c; --bad:#ec7a62; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#171c19; --card:#212824; --ink:#eef2ec; --ink2:#b5c0b8; --mute:#87928b; --line:#323b35;
  --accent:#f08a45; --accent-soft:#4a2e1c; --celadon:#7fb5a2; --celadon-soft:#26342e; --grid:#2b332e;
  --good:#5fc28c; --bad:#ec7a62; color-scheme:dark;}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5;}
.wrap{max-width:1040px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px;}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;}
header h1{margin:0;font-family:var(--display);font-weight:400;font-size:26px;letter-spacing:.01em;text-wrap:balance;flex:1 1 220px;}
header h1 small{display:block;font-family:var(--body);font-size:13px;color:var(--ink2);letter-spacing:0;}
.live{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;background:var(--celadon-soft);color:var(--celadon);font-size:13px;}

.sample{font-size:12px;color:var(--accent);background:var(--accent-soft);padding:4px 10px;border-radius:999px;}
.tabs{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;}
.tabs button{font:15px var(--display);color:var(--ink2);background:none;border:0;border-radius:999px;padding:6px 16px;cursor:pointer;}
.tabs button[aria-pressed="true"]{background:var(--accent);color:#fff;}
.tabs button:focus-visible{outline:2px solid var(--celadon);outline-offset:2px;}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:2px;}
.kpi .k{font-size:12.5px;color:var(--ink2);}
.kpi .v{font-family:var(--display);font-size:28px;line-height:1.15;font-variant-numeric:tabular-nums;}
.kpi .v small{font-size:15px;color:var(--ink2);margin-left:2px;}
.kpi .d{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums;}
.kpi .d b{font-weight:400;}
.up{color:var(--good);} .down{color:var(--bad);}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px;}
section.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px 12px;min-width:0;display:grid;gap:8px;}
section.card h2{margin:0;font-family:var(--display);font-weight:400;font-size:18px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
section.card h2 span{font-family:var(--body);font-size:12.5px;color:var(--mute);}
.chart{position:relative;}
.chart svg{display:block;width:100%;height:auto;overflow:visible;}
.chart text{fill:var(--mute);font:11px var(--body);font-variant-numeric:tabular-nums;}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;padding:6px 9px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .12s;font-variant-numeric:tabular-nums;}
.tip.on{opacity:1;}
.bars{display:grid;gap:9px;}
.bar{display:grid;grid-template-columns:70px 1fr auto;align-items:center;gap:10px;font-size:13px;}

.bar .track{height:12px;background:var(--grid);border-radius:6px;overflow:hidden;}
.bar .fill{height:100%;background:var(--celadon);border-radius:0 6px 6px 0;}
.bar .n{text-align:right;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap;min-width:84px;}
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}
.act{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;background:var(--bg);}
.act .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--card);flex:0 0 34px;}
.act .ic svg{width:19px;height:19px;}
.act b{display:block;font-family:var(--display);font-weight:400;font-size:20px;line-height:1.1;font-variant-numeric:tabular-nums;}
.act span{font-size:12px;color:var(--ink2);}
.tablewrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px;}
th{text-align:left;font-weight:400;color:var(--mute);font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;}
td{padding:9px 8px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;white-space:nowrap;}
td.num,th.num{text-align:right;}
td .who{display:inline-flex;align-items:center;gap:8px;}
td .av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:12px var(--display);color:#fff;}
.chip{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--celadon-soft);color:var(--celadon);}
.chip.off{background:var(--grid);color:var(--mute);}
.feed{display:grid;gap:2px;max-height:320px;overflow:auto;}
.feed div{display:grid;grid-template-columns:52px 1fr;gap:8px;padding:6px 2px;border-bottom:1px solid var(--grid);font-size:13px;}
.feed time{color:var(--mute);font-variant-numeric:tabular-nums;font-size:12px;padding-top:1px;}
.feed b{font-weight:400;color:var(--ink);}
.back{font-size:13px;color:var(--celadon);text-decoration:none;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);}
.note{margin:0;padding:12px 14px;border-radius:12px;background:var(--card);border:1px dashed var(--line);color:var(--ink2);font-size:13.5px;}
.note b{color:var(--accent);font-weight:400;}
.empty{color:var(--mute);font-size:13px;padding:18px 0;text-align:center;}
footer{font-size:12px;color:var(--mute);text-align:center;}
@media (max-width:480px){ header h1{font-size:22px;} .kpi .v{font-size:24px;} }
@media (prefers-reduced-motion:reduce){ .tip{transition:none;} }
</style></head><body><div class="wrap">
  <header>
    <h1>선아씨 물레 공방 관리실<small>학생들이 공방에서 무엇을 했는지 한눈에</small></h1>

  <div class="grid2">

  <div class="grid2">
    <section class="card"><h2>작품 활동</h2><div class="acts" id="acts"></div></section>
    <section class="card"><h2>최근 활동</h2><div class="feed" id="feed"></div></section>
  </div>

  <section class="card"><h2>수강생별<span>이 기간 기준 · 이름은 공방에 들어올 때 적은 이름이에요</span></h2>

  </section>

  <footer>숫자는 기록을 시작한 날부터 쌓여요 · 이 화면은 등록된 선아씨 기기에서만 열려요 · <span id="upd"></span></footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
const SUPABASE_CONFIG={url:'https://nizshtupokkapibpgnkj.supabase.co',key:'sb_publishable__-nxHAI7Qsw9R1zsyE6MKQ_OKQhKzoO'};
const TEACHER_IDS=['9839e887-d0de-4b86-a0c4-8397234475bd','4b5189e5-8ae9-462d-aa72-a48b56e400bc'];
const CLAYS=[['백자토','#ece6dc'],['분청토','#cdb48e'],['옹기토','#b56a43'],['흑토','#3a3430']];
const COLORS=['#e8742a','#4f7f70','#8a6bb8','#c2452d','#3d7cc0','#b08a2e','#2f8a5b','#a35d8f'];
let EV=[], days=7, sb=null;
const dayKey=d=>`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
const fmt=d=>`${d.getMonth()+1}.${d.getDate()}`;
const startOfDay=n=>{ const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-n); return d; };
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inRange=(a,from,to)=>a.filter(e=>e.t>=from&&e.t<to);
const cnt=(a,k)=>a.filter(e=>e.kind===k).length;
// time spent: each visit session runs from its first to its last mark (the page leaves a mark every 2 minutes)
function stayMin(a){ const s=new Map(); a.forEach(e=>{ if(!e.sid) return; const x=s.get(e.sid)||{a:e.t,b:e.t}; if(e.t<x.a) x.a=e.t; if(e.t>x.b) x.b=e.t; s.set(e.sid,x); });
  const v=[...s.values()].map(x=>(x.b-x.a)/60000+1); return v.length?Math.round(v.reduce((p,q)=>p+q,0)/v.length):0; }
function period(n){ const to=new Date(); const from=n===1?startOfDay(0):startOfDay(n-1); const pfrom=n===1?startOfDay(1):startOfDay(2*n-1); return {from,to,pfrom,pto:from}; }

function kpis(){
  const p=period(days), cur=inRange(EV,p.from,p.to), prev=inRange(EV,p.pfrom,p.pto);
  const uniq=a=>new Set(a.filter(e=>e.kind==='visit').map(e=>e.uid)).size;
  const row=[['방문자',uniq(cur),uniq(prev),'명'],['방문 횟수',cnt(cur,'visit'),cnt(prev,'visit'),'번'],['물레 앉기',cnt(cur,'sit'),cnt(prev,'sit'),'번'],
    ['물레 돌리기',cnt(cur,'spin'),cnt(prev,'spin'),'번'],['선반에 올린 작품',cnt(cur,'shelf'),cnt(prev,'shelf'),'점'],['평균 머문 시간',stayMin(cur),stayMin(prev),'분']];
  const lab=days===1?'어제보다':days===7?'지난주보다':'지난 30일보다';
  $('kpis').innerHTML=row.map(([k,v,pv,u])=>{ const df=v-pv, cls=df>0?'up':df<0?'down':'', sg=df>0?'▲ ':df<0?'▼ ':'';
    return `<div class="kpi"><span class="k">${k}</span><span class="v">${v.toLocaleString('ko-KR')}<small>${u}</small></span><span class="d">${lab} <b class="${cls}">${sg}${Math.abs(df)}</b></span></div>`; }).join('');
}
function niceStep(m){ const raw=Math.max(1,m)/4, p=Math.pow(10,Math.floor(Math.log10(raw))), f=raw/p; return Math.max(1,(f<=1?1:f<=2?2:f<=5?5:10)*p); }
function barChart(el,data,key,unit,color){
  const W=440,H=180,L=28,R=6,T=10,B=24, n=data.length, max=Math.max(1,...data.map(x=>x[key])), step=niceStep(max), top=Math.ceil(max/step)*step;
  const bw=(W-L-R)/n, gap=Math.min(6,bw*.28), y=v=>T+(H-T-B)*(1-v/top);

  for(let v=0;v<=top;v+=step){ s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`; }
  const every=n>16?Math.ceil(n/8):n>8?2:1;
  data.forEach((x,i)=>{ const bx=L+i*bw+gap/2, w=Math.max(2,bw-gap), v=x[key], yy=y(v), hgt=Math.max(0,H-B-yy), r=Math.min(4,w/2,hgt);
    if(v>0) s+=`<path d="M${bx},${H-B} V${yy+r} Q${bx},${yy} ${bx+r},${yy} H${bx+w-r} Q${bx+w},${yy} ${bx+w},${yy+r} V${H-B} Z" fill="${color}" ${x.hi?'':'opacity=".78"'}/>`;
    s+=`<rect x="${L+i*bw}" y="${T}" width="${bw}" height="${H-T-B}" fill="transparent" data-i="${i}"/>`;
    if(i%every===0||i===n-1) s+=`<text x="${bx+w/2}" y="${H-7}" text-anchor="middle">${x.label}</text>`; });
  s+=`</svg><div class="tip"></div>`; el.innerHTML=s;
  const tip=el.querySelector('.tip'), svg=el.querySelector('svg');
  const show=e=>{ const t=e.target.closest('rect[data-i]'); if(!t){ tip.classList.remove('on'); return; } const x=data[+t.dataset.i], r=svg.getBoundingClientRect(), k=r.width/W;
    tip.textContent=`${x.tip||x.label} · ${x[key]}${unit}`; tip.style.left=(+t.getAttribute('x')+bw/2)*k+'px'; tip.style.top=y(x[key])*k+'px'; tip.classList.add('on'); };
  svg.addEventListener('pointermove',show); svg.addEventListener('pointerdown',show); svg.addEventListener('pointerleave',()=>tip.classList.remove('on'));
}
function charts(){
  const span=days===1?7:days, list=[];
  for(let i=span-1;i>=0;i--){ const d=startOfDay(i), e=new Date(d); e.setDate(e.getDate()+1); const a=inRange(EV,d,e);
    list.push({label:fmt(d),tip:`${fmt(d)} (${'일월화수목금토'[d.getDay()]})`,vis:new Set(a.filter(x=>x.kind==='visit').map(x=>x.uid)).size,spins:cnt(a,'spin'),hi:i===0}); }
  $('cap1').textContent=days===1?'최근 7일 · 오른쪽 끝이 오늘':''; $('cap2').textContent=$('cap1').textContent;
  barChart($('c1'),list,'vis','명','var(--celadon)');

  const p=period(days), hrs=Array.from({length:24},(_,h)=>({label:String(h),tip:`${h}시`,n:0}));
  inRange(EV,p.from,p.to).forEach(e=>{ if(e.kind==='visit') hrs[e.t.getHours()].n++; });
  barChart($('c3'),hrs,'n','번','var(--celadon)');
}
function clays(){
  const p=period(days), a=inRange(EV,p.from,p.to).filter(e=>e.kind==='shelf'||e.kind==='clay'), c=[0,0,0,0];
  a.forEach(e=>{ const k=+((e.data||{}).k); if(k>=0&&k<4) c[k]++; });

    :'<div class="empty">아직 흙을 고른 기록이 없어요</div>';

const ICON={
  paint:'<svg viewBox="0 0 24 24" fill="none" stroke="var(--celadon)" stroke-width="2" stroke-linejoin="round"><path d="M12 3.5c-4.9 0-8.5 3.6-8.5 8.1 0 4.4 3.6 8.9 7.6 8.9 1.5 0 2-1 1.6-2.2-.4-1.2.3-2.3 1.6-2.3h2.2c2.4 0 4-1.9 4-4.3 0-4.6-3.8-8.2-8.5-8.2z"/><circle cx="8" cy="11" r="1.3" fill="var(--accent)" stroke="none"/><circle cx="11" cy="7.4" r="1.3" fill="var(--accent)" stroke="none"/><circle cx="15.2" cy="7.8" r="1.3" fill="var(--accent)" stroke="none"/></svg>',

function acts(){

const WORD={visit:'공방에 <b>들어왔어요</b>',sit:w=>`물레 ${w}번에 <b>앉았어요</b>`,spin:w=>`물레 ${w}번을 <b>돌리기 시작했어요</b>`,clay:k=>`${CLAYS[k]?CLAYS[k][0]:'흙'}을 <b>골랐어요</b>`,

  const a=EV.filter(e=>e.kind!=='here').slice(-40).reverse();
  if(!a.length){ $('feed').innerHTML='<div class="empty" style="display:block">아직 기록이 없어요. 누군가 공방에 들어오면 여기에 쌓여요</div>'; return; }
  $('feed').innerHTML=a.map(e=>{ const d=e.data||{}, w=WORD[e.kind]; const txt=typeof w==='function'?(e.kind==='shelf'?w(d.k,d.h):e.kind==='clay'?w(d.k):w(d.w)):(w||esc(e.kind));
    const today=dayKey(e.t)===dayKey(new Date()), tm=e.t.toLocaleTimeString('ko-KR',{hour:'numeric',minute:'2-digit'});
    return `<div><time>${today?tm:fmt(e.t)}</time><span><b>${esc(e.name||'도예가')}</b>님이 ${txt}</span></div>`; }).join('');
}
function people(){
  const p=period(days), a=inRange(EV,p.from,p.to), by=new Map(), live=liveIds;
  a.forEach(e=>{ const x=by.get(e.uid)||{name:'',last:e.t,v:0,s:0,sh:0,ev:[]}; if(e.name) x.name=e.name; if(e.t>x.last) x.last=e.t;
    if(e.kind==='visit') x.v++; if(e.kind==='sit') x.s++; if(e.kind==='shelf') x.sh++; x.ev.push(e); by.set(e.uid,x); });
  const rows=[...by.entries()].sort((x,y)=>y[1].last-x[1].last);
  if(!rows.length){ $('people').innerHTML='<tr><td colspan="6" class="empty">이 기간에는 들어온 사람이 없어요</td></tr>'; return; }
  const ago=t=>{ const m=Math.round((Date.now()-t)/60000); return m<60?`${Math.max(1,m)}분 전`:m<1440?`${Math.round(m/60)}시간 전`:`${Math.round(m/1440)}일 전`; };
  $('people').innerHTML=rows.map(([uid,r],i)=>{ const m=stayMin(r.ev)*Math.max(1,r.v), on=live.has(uid), col=COLORS[[...uid].reduce((h,c)=>h+c.charCodeAt(0),0)%COLORS.length], nm=r.name||'도예가';
    return `<tr><td><span class="who"><span class="av" style="background:${col}">${esc(nm[0])}</span>${esc(nm)}</span></td><td>${on?'<span class="chip">지금 접속 중</span>':`<span class="chip off">${ago(r.last)}</span>`}</td><td class="num">${r.v}번</td><td class="num">${r.s}번</td><td class="num">${r.sh}점</td><td class="num">${m>=60?Math.floor(m/60)+'시간 '+(m%60)+'분':m+'분'}</td></tr>`; }).join('');
}
function render(){ kpis(); charts(); clays(); acts(); people(); feed(); $('upd').textContent='마지막 갱신 '+new Date().toLocaleTimeString('ko-KR',{hour:'numeric',minute:'2-digit'}); }
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{ days=+b.dataset.days; document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-pressed',x===b)); render(); }));

let liveIds=new Set();
async function load(){
  const since=startOfDay(61).toISOString(); let all=[], from=0;
  for(;;){ const {data,error}=await sb.from('events').select('at,uid,sid,name,kind,data').gte('at',since).order('at',{ascending:true}).range(from,from+999);
    if(error) throw error; all=all.concat(data||[]); if(!data||data.length<1000||all.length>=30000) break; from+=1000; }
  EV=all.map(r=>({t:new Date(r.at),uid:r.uid,sid:r.sid,name:r.name,kind:r.kind,data:r.data||{}}));
  $('note').hidden=EV.length>0; if(!EV.length){ $('note').innerHTML='아직 쌓인 기록이 없어요. 학생이 공방에 들어오면 이 화면에 숫자가 생겨요.'; $('note').hidden=false; }
  render();
}
(async()=>{
  if(!window.supabase){ $('note').textContent='관리실을 불러오지 못했어요. 새로고침해 주세요.'; return; }
  sb=window.supabase.createClient(SUPABASE_CONFIG.url,SUPABASE_CONFIG.key);
  let {data:{session}}=await sb.auth.getSession();
  if(!session){ const r=await sb.auth.signInAnonymously(); session=r.data&&r.data.session; }
  const me=session&&session.user.id;
  if(!me||!TEACHER_IDS.includes(me)){ $('note').innerHTML='이 기기는 관리자 기기로 등록되지 않았어요.<br>등록된 선아씨 휴대폰이나 노트북의 <b>같은 브라우저</b>에서 열어 주세요.'; $('liveN').textContent='—'; return; }
  // who is in the studio right now (listening only: the manager does not appear in the studio)
  const ch=sb.channel('studio'); ch.on('presence',{event:'sync'},()=>{ const st=ch.presenceState(); liveIds=new Set(Object.keys(st)); $('liveN').textContent=`지금 공방에 ${liveIds.size}명`; if(EV.length) people(); }).subscribe();
  try{ await load(); }catch(e){ console.warn(e); $('note').innerHTML='기록을 읽지 못했어요. Supabase에 <b>events 표</b>가 만들어졌는지 확인해 주세요.'; return; }
  sb.channel('events-live').on('postgres_changes',{event:'INSERT',schema:'public',table:'events'},()=>{ clearTimeout(load.t); load.t=setTimeout(()=>load().catch(()=>{}),1500); }).subscribe();
  setInterval(()=>load().catch(()=>{}),120000);
})();
})();
</script></body></html>
